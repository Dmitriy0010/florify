server:
  port: 8080
  tomcat:
    threads:
      max: 50        # Default 200 — слишком много для 8GB машины
      min-spare: 5
    max-connections: 200
    accept-count: 50

spring:
  application:
    name: florify-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:florify_db}
    username: ${DB_USER:florify_user}
    password: ${DB_PASSWORD:florify_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10   # Ограничиваем пул DB соединений
      minimum-idle: 3
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false     # Отключаем форматирование SQL в логах
    show-sql: false
  flyway:
    enabled: true
    default-schema: public
    out-of-order: true
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: florify-app-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "ru.florify.*"
        spring.json.use.type.headers: true
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:florify_admin}
  secret-key: ${MINIO_SECRET_KEY:florify_password}
  bucket: ${MINIO_BUCKET:florify-media}

smtp:
  host: ${SMTP_HOST:sandbox.smtp.mailtrap.io}
  port: ${SMTP_PORT:2525}
  username: ${SMTP_USERNAME:893ae2166e2324}
  password: ${SMTP_PASSWORD:59e7f119b5f422}
  from: ${SMTP_FROM:Florify <info@florify.ru>}

telegram:
  apiBaseUrl: ${TELEGRAM_API_URL:https://api.telegram.org}
  botToken: ${TELEGRAM_BOT_TOKEN:}

jwt:
  secret: ${JWT_SECRET:very-long-secret-key-that-is-at-least-thirty-two-characters-long}
  issuer: florify
  access-token-ttl-minutes: 480
  refresh-token-ttl-days: 30

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

logging:
  level:
    root: WARN
    ru.florify: INFO                          # Было DEBUG — генерировало сотни строк на запрос
    ru.florify.common.security: WARN          # JWT-логи были основным мусором
    org.springframework.web: WARN
    org.hibernate: WARN
    org.apache.kafka: WARN
    com.zaxxer.hikari: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
