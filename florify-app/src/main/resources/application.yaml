server:
  port: 8080

spring:
  application:
    name: florify-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:florify_db}
    username: ${DB_USER:florify_user}
    password: ${DB_PASSWORD:florify_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # We use public schema for all modules
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    default-schema: public
    out-of-order: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: florify-app-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "ru.florify.*"
  threads:
    virtual:
      enabled: true

jwt:
  secret: ${JWT_SECRET:very-long-secret-key-that-is-at-least-thirty-two-characters-long}
  issuer: florify
  access-token-ttl-minutes: 15
  refresh-token-ttl-days: 30

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  outbox:
    relay-delay-ms: 1000

logging:
  level:
    ru.florify: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
