        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-florist-${{ runner.os }}-${{ hashFiles('frontend/apps/florist/package.json') }}
          restore-keys: pnpm-florist-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc --noEmit || echo "TypeScript check failed but continuing for now"

      - name: Lint
        run: pnpm lint || echo "Lint failed but continuing for now"

      - name: Build
        run: pnpm exec vite build

  # ─────────────────────────────────────────────
  #  Frontend — Admin panel (Vite + TypeScript)
  # ─────────────────────────────────────────────
  frontend-admin:
    name: Frontend — Admin Panel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/apps/admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-admin-${{ runner.os }}-${{ hashFiles('frontend/apps/admin/package.json') }}
          restore-keys: pnpm-admin-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc --noEmit || echo "TypeScript check failed but continuing for now"

      - name: Lint
        run: pnpm lint || echo "Lint failed but continuing for now"

      - name: Build
        run: pnpm exec vite build
