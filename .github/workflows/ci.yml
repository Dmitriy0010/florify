name: CI — Build & Lint

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  #  Java backend — build all microservices
  # ─────────────────────────────────────────────
  backend:
    name: Backend — Gradle Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (skip tests for speed, see test job)
        run: ./gradlew build -x test --no-daemon --parallel

      - name: Upload build artifacts (jars)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: '**/build/libs/*.jar'
          retention-days: 3

  # ─────────────────────────────────────────────
  #  Java backend — unit tests
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --parallel

      - name: Publish test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/test/*.xml'
          check_name: 'Backend Test Results'

  # ─────────────────────────────────────────────
  #  Frontend — Customer app (Vite + TypeScript)
  # ─────────────────────────────────────────────
  frontend-customer:
    name: Frontend — Customer App
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/apps/customer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-customer-${{ runner.os }}-${{ hashFiles('frontend/apps/customer/package.json') }}
          restore-keys: pnpm-customer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm tsc --noEmit || echo "TypeScript check failed but continuing for now"

      - name: Lint
        run: pnpm lint || echo "Lint failed but continuing for now"

      - name: Build
        run: pnpm exec vite build

  # ─────────────────────────────────────────────
  #  Frontend — Florist PWA (Vite + TypeScript)
  # ─────────────────────────────────────────────
  frontend-florist:
    name: Frontend — Florist PWA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/apps/florist

    steps:
