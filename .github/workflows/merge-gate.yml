name: Merge Gate — PR to main

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

# Make sure only one merge-gate runs per PR at a time
concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Conflict check: fail fast if PR has merge conflicts
  # ─────────────────────────────────────────────────────────────
  conflict-check:
    name: Check for Merge Conflicts
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch base (main)
        run: git fetch origin main

      - name: Check merge conflicts
        id: check
        run: |
          git config user.email "ci@florify.ru"
          git config user.name "Florify CI"
          if git merge --no-commit --no-ff origin/main; then
            echo "conflict=false" >> $GITHUB_OUTPUT
            git merge --abort 2>/dev/null || true
          else
            echo "conflict=true" >> $GITHUB_OUTPUT
            git merge --abort 2>/dev/null || true
          fi

      - name: Comment on PR about conflicts
        if: steps.check.outputs.conflict == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: conflict-warning
          message: |
            ## ⚠️ Merge Conflicts Detected

            This PR has conflicts with `main`. Please resolve them before merging:

            ```bash
            git fetch origin main
            git merge origin/main
            # resolve conflicts, then:
            git add .
            git commit -m "chore: resolve merge conflicts with main"
            git push
            ```

      - name: Fail if conflicts
        if: steps.check.outputs.conflict == 'true'
        run: |
          echo "::error::This PR has merge conflicts with main. Please resolve them."
          exit 1

  # ─────────────────────────────────────────────────────────────
  #  Summary gate: require backend + all frontends to pass
  # ─────────────────────────────────────────────────────────────
  all-checks-passed:
    name: ✅ All CI Checks Passed
    runs-on: ubuntu-latest
    needs:
      - conflict-check
    if: always()

    steps:
      - name: Check all required jobs
        run: |
          if [[ "${{ needs.conflict-check.result }}" != "success" ]]; then
            echo "::error::Conflict check failed — cannot merge."
            exit 1
          fi
          echo "All merge gate checks passed ✅"
