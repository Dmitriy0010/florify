services:
  postgres:
    image: postgres:17.5-alpine
    container_name: florify_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: florify_user
      POSTGRES_PASSWORD: florify_password
      POSTGRES_DB: florify_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-alpine
    container_name: florify_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: florify_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  minio:
    image: minio/minio:latest
    container_name: florify_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: florify_admin
      MINIO_ROOT_PASSWORD: florify_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  florify-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=florify_db
      - DB_USER=florify_user
      - DB_PASSWORD=florify_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - JWT_SECRET=${JWT_SECRET:-9a4f4ef1-4d51-4d46-93d3-a36b5f445f07}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=florify_admin
      - MINIO_SECRET_KEY=florify_password
    depends_on:
      - postgres
      - kafka
      - redis

volumes:
  postgres_data:
  minio_data:
